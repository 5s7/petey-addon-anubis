plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.minecraftforge.net/" }
    // Anubis client JAR — place anubisplus-<version>.jar in libs/ folder
    flatDir { dirs 'libs' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "petey-addon" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration()
}

dependencies {
    // Minecraft + mappings
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Anubis client — provide the JAR in libs/ as anubisplus-<anubis_version>.jar
    // or replace with proper Maven coordinates if published
    compileOnly(files("libs/anubisplus-${anubis_version}.jar"))

    // MixinExtras (bundled with Fabric Loom >= 1.4, explicit here for clarity)
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.3.5")))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// Standard Fabric publishing block — fill in your credentials if needed
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
